{% extends "painel/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block topbar_actions %}
<a href="{% url 'painel:bairro_list' %}" class="topbar-btn btn-outline-dark">← Voltar</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header"><span class="card-header-title">{{ titulo }}</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom:1.2rem">
        <label class="form-label">Nome do bairro *</label>
        <input type="text" name="nome" class="form-control"
               value="{{ bairro.nome|default:'' }}" placeholder="Ex: Jardins" required>
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label class="form-label">Cidade *</label>
        <select name="cidade" class="form-control" required>
          <option value="">Selecione...</option>
          {% for cidade in cidades %}
          <option value="{{ cidade.pk }}"
            {% if bairro.cidade_id == cidade.pk %}selected{% endif %}>
            {{ cidade.nome }}/{{ cidade.estado }}
          </option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="topbar-btn btn-gold" style="width:100%;justify-content:center;padding:0.9rem">
        💾 Salvar
      </button>
    </form>
  </div>
</div>
{% endblock %}
